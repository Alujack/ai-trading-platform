services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: trading-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-trading}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the `n8n` database on first init (see infra/postgres/init).
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-trading}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trading-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Application services -------------------------------------------------
  # Two application frameworks (docs/plans/11): Next.js for the dashboard, the
  # session boundary and a thin same-origin BFF; Python/FastAPI for every
  # trading-domain concern. Services talk to each other by name on their
  # INTERNAL ports (postgres:5432, redis:6379, backend:8000) — independent of the
  # host-shifted ports in .env. Connection URLs are overridden here; everything
  # else (API keys, secrets) comes from .env via env_file. `environment` always
  # wins over `env_file`.
  #
  #   docker compose up                    # web + backend + worker + n8n
  #   docker compose --profile live up      # ...plus the MT5 bridge
  #   docker compose --profile legacy up    # ...plus Express, for a rollback

  # Trading-domain backend (FastAPI). Owns Postgres, Redis, the signal gate, the
  # authoritative risk engine, paper/live execution, AI orchestration, Telegram +
  # broker integrations, SSE and the scheduled jobs. The AI service that used to
  # live at services/ai is now in-process here (app/integrations/ai), so there is
  # no internal HTTP hop for analysis calls.
  #
  # Runs `alembic upgrade head` before serving: on an existing database the
  # baseline revision ADOPTS the Prisma-created schema without touching a row.
  #
  # NOT published to the host by default — the browser reaches it only through
  # the Next.js BFF. Set BACKEND_PORT in .env to expose it for debugging.
  backend:
    build:
      context: ./services/backend
    container_name: trading-backend
    restart: unless-stopped
    env_file: .env
    command: >-
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-trading}
      - REDIS_URL=redis://redis:6379
      # Exactly ONE process may own the schedulers (approval expiry, paper
      # reconcile, trailing stops). Keep this true here and false anywhere else.
      - BACKEND_JOB_OWNER=${BACKEND_JOB_OWNER:-true}
      - API_SHADOW_MODE=${API_SHADOW_MODE:-false}
      - BROKER=${BROKER:-paper}
      - EXNESS_ENV=${EXNESS_ENV:-demo}
      # In-network default: reach the dockerized bridge by service name. Override
      # MT5_BRIDGE_URL in .env (e.g. http://host.docker.internal:8800) only if you
      # run the bridge natively on the host instead of the `live` profile.
      - MT5_BRIDGE_URL=${MT5_BRIDGE_URL:-http://mt5bridge:8800}
      - MT5_BRIDGE_TOKEN=${MT5_BRIDGE_TOKEN:-}
      - 'BROKER_SYMBOL_MAP={"EURUSD":"EURUSDm","XAUUSD":"XAUUSDm","BTCUSD":"BTCUSDm"}'
      # Where the UI-triggered backtester lives (mounted below).
      - BACKTEST_DATA_DIR=/data
      # Secret overrides pasted from the dashboard persist on a named volume so
      # they survive a rebuild without ever entering the image.
      - AI_PROVIDER_OVERRIDES_PATH=/state/.provider_overrides.json
      - TELEGRAM_OVERRIDES_PATH=/state/.telegram-overrides.json
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./services/backend/app:/app/app
      - ./services/backend/migrations:/app/migrations
      - ./services/backend/scripts:/app/scripts
      # The backtest job spawns services/data/backtester.py as a child process.
      - ./services/data:/data
      - backend-state:/state
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).status==200 else 1)\""]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # LEGACY Express + Prisma API — the rollback path, NOT started by default.
  #
  # docs/plans/11 keeps this service available until the FastAPI backend has
  # completed its paper-trading soak, because the documented rollback is "point
  # the worker gate back to Express". It is behind the `legacy` profile so
  # `docker compose up` runs the two-framework architecture:
  #
  #     docker compose up                      # Next.js + Python only
  #     docker compose --profile legacy up     # adds Express for a rollback
  #
  # NEVER run both execution engines at once: if you start this, first set the
  # global execution mode to OFF and stop the backend's schedulers
  # (BACKEND_JOB_OWNER=false). See docs/runbooks/11-cutover-and-rollback.md.
  api:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: Dockerfile.node
    image: ai-trading-node:dev
    container_name: trading-api
    restart: unless-stopped
    command: >-
      sh -c "npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma &&
             npx prisma generate --schema=apps/api/prisma/schema.prisma &&
             npm run dev --workspace=@ai-trading/api"
    env_file: .env
    environment:
      - NODE_ENV=development
      - API_HOST=0.0.0.0
      - API_PORT=4000
      - API_PUBLIC_URL=http://localhost:4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-trading}
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # The AI service is in-process in the Python backend now; this points the
      # legacy container at the backend's /analyze/* compatibility routes.
      - AI_SERVICE_URL=http://backend:8000
      # Off by default: the FastAPI backend owns execution. Only flip these in a
      # deliberate rollback, with the backend's jobs stopped first.
      - ENABLE_PAPER_TRADING=false
      - ENABLE_WEEKLY_REVIEW=false
      - ENABLE_DAILY_BRIEFING=false
      - BROKER=${BROKER:-paper}
      - EXNESS_ENV=${EXNESS_ENV:-demo}
      # In-network default: reach the dockerized bridge by service name. Override
      # MT5_BRIDGE_URL in .env (e.g. http://host.docker.internal:8800) only if you
      # run the bridge natively on the host instead of the `live` profile.
      - MT5_BRIDGE_URL=${MT5_BRIDGE_URL:-http://mt5bridge:8800}
      - MT5_BRIDGE_TOKEN=${MT5_BRIDGE_TOKEN:-}
      - 'BROKER_SYMBOL_MAP={"EURUSD":"EURUSDm","XAUUSD":"XAUUSDm","BTCUSD":"BTCUSDm"}'
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
      - ./apps/api/scripts:/app/apps/api/scripts
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Next.js dashboard + the thin same-origin BFF. Internal port 3000, published
  # on the host at :3100.
  #
  # The browser now calls ONLY this origin: app/api/[...path] forwards /api/*
  # to the Python backend over PYTHON_API_URL, which is server-only and never
  # reaches the client bundle. NEXT_PUBLIC_API_URL is deliberately unset — the
  # web client falls back to relative /api paths (see apps/web/lib/api.ts).
  web:
    build:
      context: .
      dockerfile: Dockerfile.node
    image: ai-trading-node:dev
    container_name: trading-web
    restart: unless-stopped
    command: npm run dev --workspace=@ai-trading/web
    env_file: .env
    environment:
      - NODE_ENV=development
      - WEB_PORT=3000
      # Server-only BFF target. No NEXT_PUBLIC_ prefix: the Docker hostname and
      # every backend secret must stay out of the browser bundle.
      - PYTHON_API_URL=http://backend:8000
      # Forced EMPTY so the browser uses same-origin /api/*. Next inlines every
      # NEXT_PUBLIC_* into the client bundle, so a leftover value in .env would
      # send the browser straight to the legacy Express host and bypass the BFF.
      # `environment` beats `env_file`, which is exactly why this line is here.
      - NEXT_PUBLIC_API_URL=
      # Windows bind mounts don't propagate inotify events into the container —
      # poll so next dev hot-reloads on host-side edits.
      - WATCHPACK_POLLING=true
    ports:
      - "${WEB_PORT:-3100}:3000"
    volumes:
      - ./apps/web/app:/app/apps/web/app
      - ./apps/web/lib:/app/apps/web/lib
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      backend:
        condition: service_started

  # Python worker: candles → indicators → strategy scan → POST candidates to the
  # gate. Points at the FastAPI backend; STRATEGY_GATE_URL is the single switch
  # the cutover/rollback procedure flips (docs/runbooks/11-cutover-and-rollback.md).
  worker:
    build:
      context: ./services/data
    container_name: trading-worker
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-trading}
      - REDIS_URL=redis://redis:6379
      # Base URL for the worker's API calls (rt-notify, raw-feed probe).
      - API_PUBLIC_URL=${WORKER_API_BASE:-http://backend:8000}
      # The signal gate. Rollback = point this back at http://api:4000.
      - STRATEGY_GATE_URL=${STRATEGY_GATE_URL:-http://backend:8000/api/signals/candidate}
      # /analyze/* now lives on the backend (compatibility routes).
      - AI_SERVICE_URL=http://backend:8000
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./services/data:/app

  # News-automation layer. Polls economic-calendar + headline feeds on a
  # schedule, normalizes, dedupes, and upserts into the trading DB's NewsEvent
  # table. Keeps brittle news plumbing out of the Python worker.
  # See docs/plans/06-n8n-migration-buildplan.md.
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: trading-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      # n8n's own state lives in a separate `n8n` database (created on init).
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-postgres}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      # Required: encrypts stored credentials. Generate: openssl rand -hex 24
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # Time-window math in the risk engine assumes UTC end-to-end.
      - GENERIC_TIMEZONE=UTC
      - TZ=UTC
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      # Workflow B reads these. The /analyze/* routes moved into the Python
      # backend (services/ai was folded in), so reach it by that service name.
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-}
      - NEWS_SUMMARY_URL=http://backend:8000/analyze/news-summary
      # The workflows read $env.* in expressions; n8n denies that by default.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  # MT5 bridge (Plan 08) — runs the Exness/MT5 terminal under Wine so the whole
  # stack, including live execution, comes up with one compose. Heavy (GUI under
  # Wine), so it's behind the `live` profile: paper/dev runs without it
  # (`docker compose up`), live brings it in (`docker compose --profile live up`).
  # MT5 account creds are Phase-1 env vars; Phase 2 moves them to the DB/UI.
  mt5bridge:
    build:
      context: ./services/mt5bridge
    container_name: trading-mt5bridge
    restart: unless-stopped
    profiles: ["live"]
    env_file: .env
    environment:
      - BRIDGE_HOST=0.0.0.0
      - BRIDGE_PORT=8800
      - MT5_LOGIN=${MT5_LOGIN:-}
      - MT5_PASSWORD=${MT5_PASSWORD:-}
      - MT5_SERVER=${MT5_SERVER:-}
      - MT5_BRIDGE_TOKEN=${MT5_BRIDGE_TOKEN:-}
      - DEFAULT_DEVIATION=${DEFAULT_DEVIATION:-20}
    ports:
      - "${MT5_BRIDGE_PORT:-8800}:8800"
      - "${MT5_VNC_PORT:-3001}:3000" # noVNC — view/log-in to the terminal
    shm_size: "1gb" # Wine + GUI needs more shared memory than the 64m default

volumes:
  postgres-data:
  redis-data:
  n8n-data:
  # Dashboard-pasted AI keys and Telegram credentials. Kept on a volume so they
  # survive a rebuild without ever being baked into the image.
  backend-state:
