<svg width="100%" viewBox="0 0 680 540" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>AI trading platform architecture</title>
  <desc>Next.js dashboard talks over REST to an Express API containing the signal engine, risk engine, paper trading and performance modules. The API calls a FastAPI AI service and reads and writes Postgres and Redis. A Python data worker ingests market data into Postgres. External providers supply LLM, market and news data.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .t  { font-size: 14px; font-weight: 500; fill: #111827; }
    .ts { font-size: 12px; font-weight: 400; fill: #4b5563; }
    .arr { stroke: #6b7280; stroke-width: 1.5; fill: none; }
    .purple { fill: #eeedfe; stroke: #534ab7; stroke-width: 1; }
    .teal   { fill: #e1f5ee; stroke: #0f6e56; stroke-width: 1; }
    .gray   { fill: #f1efe8; stroke: #5f5e5a; stroke-width: 1; }
    .box    { fill: #ffffff; stroke: #9ca3af; stroke-width: 1; }
  </style>

  <text x="40" y="32" class="t" font-size="16">AI trading platform — architecture</text>

  <rect class="purple" x="250" y="56" width="180" height="54" rx="8"/>
  <text class="t"  x="340" y="85"  text-anchor="middle">Web dashboard</text>
  <text class="ts" x="340" y="101" text-anchor="middle">Next.js · apps/web</text>

  <line class="arr" x1="340" y1="110" x2="340" y2="141" marker-end="url(#arrow)"/>
  <text class="ts" x="348" y="131" text-anchor="start">REST /api</text>

  <rect class="box" x="50" y="141" width="580" height="110" rx="8"/>
  <text class="t" x="70" y="166">API server · Express + TypeScript (apps/api)</text>
  <rect class="purple" x="70"  y="182" width="126" height="56" rx="6"/>
  <text class="t" x="133" y="214" text-anchor="middle">Signal engine</text>
  <rect class="purple" x="208" y="182" width="126" height="56" rx="6"/>
  <text class="t" x="271" y="214" text-anchor="middle">Risk engine</text>
  <rect class="purple" x="346" y="182" width="126" height="56" rx="6"/>
  <text class="t" x="409" y="214" text-anchor="middle">Paper trading</text>
  <rect class="purple" x="484" y="182" width="126" height="56" rx="6"/>
  <text class="t" x="547" y="214" text-anchor="middle">Performance</text>

  <line class="arr" x1="115" y1="251" x2="115" y2="306" marker-end="url(#arrow)"/>
  <text class="ts" x="121" y="282" text-anchor="start">validate</text>
  <line class="arr" x1="257" y1="251" x2="257" y2="306" marker-end="url(#arrow)"/>
  <line class="arr" x1="399" y1="251" x2="399" y2="306" marker-end="url(#arrow)"/>

  <rect class="purple" x="50"  y="306" width="130" height="58" rx="8"/>
  <text class="t"  x="115" y="332" text-anchor="middle">AI service</text>
  <text class="ts" x="115" y="349" text-anchor="middle">FastAPI · services/ai</text>
  <rect class="teal" x="192" y="306" width="130" height="58" rx="8"/>
  <text class="t"  x="257" y="332" text-anchor="middle">Redis</text>
  <text class="ts" x="257" y="349" text-anchor="middle">cache + queues</text>
  <rect class="teal" x="334" y="306" width="130" height="58" rx="8"/>
  <text class="t"  x="399" y="332" text-anchor="middle">Postgres</text>
  <text class="ts" x="399" y="349" text-anchor="middle">TimescaleDB</text>
  <rect class="purple" x="476" y="306" width="130" height="58" rx="8"/>
  <text class="t"  x="541" y="332" text-anchor="middle">Data worker</text>
  <text class="ts" x="541" y="349" text-anchor="middle">Python · services/data</text>

  <line class="arr" x1="476" y1="335" x2="466" y2="335" marker-end="url(#arrow)"/>

  <line class="arr" x1="115" y1="364" x2="170" y2="411" marker-end="url(#arrow)"/>
  <line class="arr" x1="541" y1="364" x2="511" y2="411" marker-end="url(#arrow)"/>

  <rect class="gray" x="50"  y="411" width="240" height="52" rx="8"/>
  <text class="t"  x="170" y="436" text-anchor="middle">LLM providers</text>
  <text class="ts" x="170" y="453" text-anchor="middle">OpenAI · Anthropic</text>
  <rect class="gray" x="416" y="411" width="190" height="52" rx="8"/>
  <text class="t"  x="511" y="436" text-anchor="middle">Market + news data</text>
  <text class="ts" x="511" y="453" text-anchor="middle">Polygon · Finnhub · News</text>

  <rect class="purple" x="50"  y="492" width="14" height="14" rx="3"/>
  <text class="ts" x="70"  y="503" text-anchor="start">application services</text>
  <rect class="teal"   x="240" y="492" width="14" height="14" rx="3"/>
  <text class="ts" x="260" y="503" text-anchor="start">data stores</text>
  <rect class="gray"   x="370" y="492" width="14" height="14" rx="3"/>
  <text class="ts" x="390" y="503" text-anchor="start">external providers</text>
</svg>
