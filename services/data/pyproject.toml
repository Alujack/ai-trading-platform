[project]
name = "trading-data"
version = "0.1.0"
description = "Market data ingestion workers"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "psycopg[binary]>=3.1.18",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.2",
    "pytest>=8.2.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
